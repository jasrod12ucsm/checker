# Uso:
#   docker compose build                 construir la imagen (una vez)
#   docker compose run --rm verificar    construir y verificar los requerimientos (< 1 min)
#   docker compose run --rm plugin       construir el plugin y correr leyes + lit
#   docker compose run --rm calidad      formato, mypy, leyes del arnés, cobertura del núcleo
#   docker compose run --rm experimento  banco en 4 condiciones + regla de regresión
#   docker compose run --rm linter       (prototipo retirado, D-01)
#   docker compose run --rm shell        shell interactiva dentro del entorno
#   docker compose run --rm query        REPL de clang-query para descubrir matchers
#   docker compose up sistema            Centinela C++ (revisor de PR) en http://localhost:8080
#   docker compose up sistema-demo       demostración con un GitHub simulado (sin token)
#   docker compose run --rm sistema-pruebas   pruebas del sistema, con clang y el checker reales
#   docker compose run --rm sistema-no-funcionales   carga, estrés, volumen, configuración y seguridad

x-base: &base
  build:
    context: .
    dockerfile: Dockerfile
    args:
      LLVM_VERSION: "21"
  image: checker:llvm21
  working_dir: /work
  volumes:
    # El codigo se monta desde el host: editas fuera, compilas dentro.
    - .:/work
    # El build vive en un volumen: el binario enlaza contra /usr/lib/llvm-21
    # del contenedor y no sirve en el host, ademas de evitar lios de permisos.
    - build:/work/build
  init: true

services:
  # Compila y ejecuta el linter contra la suite de tests.
  linter:
    <<: *base
    command:
      - bash
      - -euo
      - pipefail
      - -c
      - |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build build
        ./build/mi-linter test/catch_by_value.cpp -- -std=c++17

  # Plugin de CSA: construir, leyes del núcleo y pruebas lit.
  plugin:
    <<: *base
    command:
      - bash
      - -euo
      - pipefail
      - -c
      - |
        cmake -S plugin -B build/plugin -G Ninja -DCMAKE_BUILD_TYPE=Debug
        cmake --build build/plugin
        ./build/plugin/dominio_tests --gtest_brief=1
        lit build/plugin/tests/lit

  # Calidad (7.4): formato, mypy, leyes del arnés y cobertura del núcleo >= 90 %.
  calidad:
    <<: *base
    command: ["bash", "plugin/tests/calidad.sh"]

  # Experimento (RF-13): el banco en las cuatro condiciones, la regla de regresión del CI
  # y el costo del checker (RNF-04, RNF-05).
  experimento:
    <<: *base
    command:
      - bash
      - -euo
      - pipefail
      - -c
      - |
        cmake -S plugin -B build/plugin -G Ninja -DCMAKE_BUILD_TYPE=Debug >/dev/null
        cmake --build build/plugin >/dev/null
        python3 bench/experimento.py
        python3 bench/regresion.py
        python3 bench/rendimiento.py

  # Verificación de los requerimientos (libro: Guía de uso). Rápida por omisión;
  # «docker compose run --rm verificar --completo» corre además el banco entero.
  verificar:
    <<: *base
    entrypoint: ["bash", "verificar.sh"]

  # Shell interactiva con todo el toolchain en el PATH.
  shell:
    <<: *base
    command: ["bash"]
    stdin_open: true
    tty: true

  # REPL para descubrir matchers sin recompilar.
  query:
    <<: *base
    command: ["clang-query", "test/catch_by_value.cpp", "--", "-std=c++17"]
    stdin_open: true
    tty: true

  # Centinela C++: el revisor automático de pull requests (libro: Sistema).
  # Configuración en sistema/.env (copiar de sistema/.env.ejemplo).
  sistema:
    build:
      context: .
      dockerfile: sistema/Dockerfile
      # La base es la imagen del checker: compose la construye antes que esta.
      additional_contexts:
        checker-base: service:shell
    image: centinela:local
    env_file:
      - path: sistema/.env
        required: false
    ports:
      - "8080:8080"
    volumes:
      - centinela-datos:/datos
    init: true

  # Demostración sin credenciales: GitHub simulado + Centinela real, en http://localhost:8080.
  sistema-demo:
    image: centinela:local
    build:
      context: .
      dockerfile: sistema/Dockerfile
      # La base es la imagen del checker: compose la construye antes que esta.
      additional_contexts:
        checker-base: service:shell
    command: ["npx", "tsx", "demo/demostrar.ts"]
    environment:
      CENTINELA_BD: ":memory:"
    ports:
      - "8080:8080"
    init: true

  sistema-pruebas:
    image: centinela:local
    build:
      context: .
      dockerfile: sistema/Dockerfile
      # La base es la imagen del checker: compose la construye antes que esta.
      additional_contexts:
        checker-base: service:shell
    command: ["npm", "test"]
    init: true

  # Pruebas no funcionales (práctica 8): carga, estrés, volumen, configuración y seguridad
  # contra el servicio real; los resultados quedan en sistema/no-funcionales/resultados/.
  sistema-no-funcionales:
    image: centinela:local
    build:
      context: .
      dockerfile: sistema/Dockerfile
      additional_contexts:
        checker-base: service:shell
    command: ["npx", "tsx", "no-funcionales/medir.ts"]
    volumes:
      - ./sistema/no-funcionales/resultados:/opt/centinela/sistema/no-funcionales/resultados
    init: true

volumes:
  build:
  centinela-datos:
