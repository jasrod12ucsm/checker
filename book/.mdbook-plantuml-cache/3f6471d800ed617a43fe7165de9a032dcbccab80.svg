<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="927px" preserveAspectRatio="none" style="width:461px;height:927px;background:#FFFFFF;" version="1.1" viewBox="0 0 461 927" width="461px" zoomAndPan="magnify"><defs/><g><!--entity runner--><g id="elem_runner"><ellipse cx="145.6788" cy="14" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M145.6788,22 L145.6788,49 M132.6788,30 L158.6788,30 M145.6788,49 L132.6788,64 M145.6788,49 L158.6788,64 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="87.1776" x="102.09" y="80.4659">Checker local</text></g><!--entity objDriver--><g id="elem_objDriver"><rect fill="#E8F5E9" height="58.1358" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="124.4676" x="83.44" y="239.96"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="104.4676" x="93.44" y="264.9259">driver : MiLinter</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="56.3638" x="93.44" y="283.9939">&#171;objeto&#187;</text></g><!--entity objTool--><g id="elem_objTool"><rect fill="#E3F2FD" height="58.1358" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="179.0674" x="56.14" y="352.96"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="159.0674" x="66.14" y="377.9259">herramienta : ClangTool</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="56.3638" x="66.14" y="396.9939">&#171;objeto&#187;</text></g><!--entity objFinder--><g id="elem_objFinder"><rect fill="#FFF3E0" height="58.1358" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="175.2314" x="58.06" y="465.96"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="155.2314" x="68.06" y="490.9259">buscador : MatchFinder</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="56.3638" x="68.06" y="509.9939">&#171;objeto&#187;</text></g><!--entity objCheck--><g id="elem_objCheck"><rect fill="#FCE4EC" height="58.1358" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="194.1593" x="48.6" y="578.96"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="174.1593" x="58.6" y="603.9259">regla : CatchByValueCheck</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="56.3638" x="58.6" y="622.9939">&#171;objeto&#187;</text></g><!--entity objDiagnostics--><g id="elem_objDiagnostics"><rect fill="#F3E5F5" height="58.1358" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="235.5292" x="27.91" y="862.96"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="215.5292" x="37.91" y="887.9259">diagn&#243;sticos : DiagnosticsEngine</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="56.3638" x="37.91" y="906.9939">&#171;objeto&#187;</text></g><g id="elem_GMN13"><path d="M35.74,139.33 L35.74,184.742 A0,0 0 0 0 35.74,184.742 L142,184.742 L146,239.6 L150,184.742 L255.6142,184.742 A0,0 0 0 0 255.6142,184.742 L255.6142,149.33 L245.6142,139.33 L35.74,139.33 A0,0 0 0 0 35.74,139.33 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M245.6142,139.33 L245.6142,149.33 L255.6142,149.33 L245.6142,139.33 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.5802" x="41.74" y="158.227">2. Antes de ejecutar, el driver</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.8742" x="41.74" y="175.933">registra la regla en MatchFinder.</text></g><g id="elem_GMN16"><path d="M11.35,691.91 L11.35,808.1461 A0,0 0 0 0 11.35,808.1461 L280.0002,808.1461 A0,0 0 0 0 280.0002,808.1461 L280.0002,701.91 L270.0002,691.91 L150,691.91 L146,637.45 L142,691.91 L11.35,691.91 A0,0 0 0 0 11.35,691.91 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M270.0002,691.91 L270.0002,701.91 L280.0002,701.91 L270.0002,691.91 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.6452" x="17.35" y="710.807">4.3 Incrementa Hallazgos localmente.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.6682" x="17.35" y="728.513">Antes de 4.2, filtra macros y c&#243;digo</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="162.5521" x="17.35" y="746.219">fuera del archivo principal.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.38" x="17.35" y="763.9251">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.5032" x="17.35" y="781.6311">Al finalizar, ClangTool retorna su estado</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="247.6502" x="17.35" y="799.3371">al driver; este entrega el total al checker.</text></g><!--link runner to objDriver--><g id="link_runner_objDriver"><path d="M189.49,45.03 C224.59,45.03 268,45.03 268,45.03 C268,45.03 268,269.03 268,269.03 C268,269.03 244.37,269.03 214.27,269.03 " fill="none" id="runner-to-objDriver" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="208.27,269.03,217.27,273.03,213.27,269.03,217.27,265.03,208.27,269.03" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="152.7111" x="269" y="162.537">1. ejecutar(archivo, flags)</text></g><!--link objDriver to objTool--><g id="link_objDriver_objTool"><path d="M146,298.43 C146,315.17 146,330.07 146,346.78 " fill="none" id="objDriver-to-objTool" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="146,352.78,150,343.78,146,347.78,142,343.78,146,352.78" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="138.0992" x="7" y="340.507">3. run(FrontendAction)</text></g><!--link objTool to objFinder--><g id="link_objTool_objFinder"><path d="M146,411.43 C146,428.17 146,443.07 146,459.78 " fill="none" id="objTool-to-objFinder" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="146,465.78,150,456.78,146,460.78,142,456.78,146,465.78" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="95.0171" x="50" y="453.507">4. recorrerAST()</text></g><!--link objFinder to objCheck--><g id="link_objFinder_objCheck"><path d="M146,524.43 C146,541.17 146,556.07 146,572.78 " fill="none" id="objFinder-to-objCheck" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="146,578.78,150,569.78,146,573.78,142,569.78,146,578.78" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="126.7502" x="19" y="566.507">4.1 run(MatchResult)</text></g><!--link objCheck to objDiagnostics--><g id="link_objCheck_objDiagnostics"><path d="M243.01,608.03 C272.86,608.03 298,608.03 298,608.03 C298,608.03 298,892.03 298,892.03 C298,892.03 289.68,892.03 269.82,892.03 " fill="none" id="objCheck-to-objDiagnostics" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="263.82,892.03,272.82,896.03,268.82,892.03,272.82,888.03,263.82,892.03" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="154.9732" x="299" y="754.527">4.2 Report(warning, fix-it)</text></g></g></svg>