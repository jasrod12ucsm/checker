<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="561px" preserveAspectRatio="none" style="width:1245px;height:561px;background:#FFFFFF;" version="1.1" viewBox="0 0 1245 561" width="1245px" zoomAndPan="magnify"><defs/><g><!--entity Norma--><g id="elem_Norma"><rect fill="#EAF0F7" height="80.5313" rx="3" ry="3" style="stroke:#34495E;stroke-width:0.5;" width="459.7974" x="556" y="12"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="207.1431" x="566" y="34.0669">&#9312; Norma C++17 como datos</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="139.7437" x="777.2754" y="34.0669">(escrita una sola vez)</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="300.2188" x="566" y="49.1997">norma/matriz.json: cada regla con su cl&#225;usula</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="439.7974" x="566" y="64.3325">(contenedor, operaci&#243;n, punto) &#215; categor&#237;a &#215; relaci&#243;n con el punto</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="344.6777" x="566" y="79.4653">&#8594; Preserva | Invalida | Depende(capacidad o rehash)</text></g><!--entity Obt--><g id="elem_Obt"><rect fill="#FFFFFF" height="50.2656" rx="3" ry="3" style="stroke:#34495E;stroke-width:0.5;" width="615.626" x="152" y="146"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="75.4038" x="162" y="168.0669">&#9313; Obtener</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="286.9966" x="241.5361" y="168.0669">(begin(), find(), *it, c[i], front(), insert().first)</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="595.626" x="162" y="183.1997">handle = (contenedor, categor&#237;a: iterador | referencia | puntero, posici&#243;n, validez = V&#225;lido)</text></g><!--entity Mut--><g id="elem_Mut"><rect fill="#FFFFFF" height="65.3984" rx="3" ry="3" style="stroke:#34495E;stroke-width:0.5;" width="642.1592" x="6" y="259.5"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="59.1221" x="16" y="281.5669">&#9314; Mutar</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="558.9048" x="79.2544" y="281.5669">el mismo contenedor: efecto = norma(mutaci&#243;n, categor&#237;a, relaci&#243;n(posici&#243;n, punto))</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="518.978" x="16" y="296.6997">Preserva &#8594; V&#225;lido, la posici&#243;n se mueve  &#183;  Invalida &#8594; Inv&#225;lido + nota en la ruta</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="614.8086" x="16" y="311.8325">Depende &#8594; con cr&#233;dito de reserve(size() + k): V&#225;lido  &#183;  sin cr&#233;dito: No resuelto (con su raz&#243;n)</text></g><!--entity Uso--><g id="elem_Uso"><rect fill="#FFFFFF" height="65.3984" rx="3" ry="3" style="stroke:#34495E;stroke-width:0.5;" width="519.9478" x="407" y="372"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="49.0103" x="417" y="394.0669">&#9315; Usar</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="100.7373" x="470.1426" y="394.0669">(*it, ++it, r, *p)</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="499.9478" x="417" y="409.1997">V&#225;lido &#8594; nada  &#183;  No resuelto &#8594; aviso posible (solo con PolicyMode=Possibly)</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="417.0854" x="417" y="424.3325">Inv&#225;lido &#8594; aviso confirmado con la ruta obtener &#8594; mutar &#8594; usar</text></g><!--entity Eval--><g id="elem_Eval"><rect fill="#EAF0F7" height="65.3984" rx="3" ry="3" style="stroke:#34495E;stroke-width:0.5;" width="591.5557" x="648" y="490"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="94.4912" x="658" y="512.0669">&#9316; Evaluaci&#243;n</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="476.1694" x="752.4912" y="512.0669">: banco de casos etiquetados desde la misma norma (UB, SAFE, POLICY),</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="346.2012" x="658" y="527.1997">etiquetas contrastadas con libstdc++ Debug y ASan.</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="571.5557" x="658" y="542.3325">CSA solo frente a CSA + checker; cotejo por sitio de uso &#8594; precisi&#243;n, exhaustividad, F1.</text></g><g id="elem_GMN12"><path d="M666,252 L666,288 L648.1523,292 L666,296 L666,331.6641 A3,3 0 0 0 669,334.6641 L1028.9697,334.6641 A3,3 0 0 0 1031.9697,331.6641 L1031.9697,259 L1021.9697,249 L669,249 A3,3 0 0 0 666,252 " fill="#FFFBEA" style="stroke:#C9B458;stroke-width:0.5;"/><path d="M1021.9697,249 L1021.9697,257.5 A1.5,1.5 0 0 0 1023.4697,259 L1031.9697,259 L1021.9697,249 " fill="#FFFBEA" style="stroke:#C9B458;stroke-width:0.5;"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="344.9697" x="672" y="266.0669">V&#225;lido &#8849; No resuelto &#8849; Inv&#225;lido: la validez s&#243;lo sube;</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="184.5581" x="672" y="281.1997">re-obtener crea otro handle.</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="286.9141" x="672" y="296.3325">it = c.erase(it) da un handle nuevo y v&#225;lido.</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="263.1357" x="672" y="311.4653">Si el contenedor escapa a c&#243;digo opaco,</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="324.4858" x="672" y="326.5981">se olvidan los v&#225;lidos; un inv&#225;lido sigue avisando.</text></g><polygon fill="#34495E" points="527.2833,145.9555,537.1045,146.6935,531.9917,144.2729,534.4123,139.1601,527.2833,145.9555" style="stroke:#34495E;stroke-width:1.0;"/><path d="M675.1764,93.1041 C626.0766,110.6506 575.5657,128.7012 532.9333,143.9364 " fill="none" style="stroke:#34495E;stroke-width:1.0;"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="367.0254" x="625" y="124.1387">NormTable.inc generada (gen_tabla.py comprueba las leyes)</text><polygon fill="#34495E" points="362.4559,259.2763,371.8303,256.2561,366.1821,255.9423,366.4959,250.2941,362.4559,259.2763" style="stroke:#34495E;stroke-width:1.0;"/><path d="M433.0855,196.0814 C412.7431,214.2825 389.1021,235.435 366.9274,255.2755 " fill="none" style="stroke:#34495E;stroke-width:1.0;"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="202.9512" x="412" y="227.1387">en cada camino simb&#243;lico de CSA</text><polygon fill="#34495E" points="569.8959,371.9412,562.5729,365.3552,565.1407,370.3957,560.1002,372.9635,569.8959,371.9412" style="stroke:#34495E;stroke-width:1.0;"/><path d="M423.9753,324.517 C469.7083,339.3802 518.4404,355.2181 564.1897,370.0866 " fill="none" style="stroke:#34495E;stroke-width:1.0;"/><polygon fill="#34495E" points="868.6894,489.962,861.933,482.796,864.0775,488.0306,858.8429,490.1751,868.6894,489.962" style="stroke:#34495E;stroke-width:1.0;"/><path d="M742.3256,437.0443 C781.5759,453.4812 823.907,471.2083 863.1551,487.6444 " fill="none" style="stroke:#34495E;stroke-width:1.0;"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="76.0547" x="824" y="468.1387">avisos SARIF</text><polygon fill="#7F8C8D" points="1008.9053,489.938,1018.6304,488.3813,1013.096,487.2106,1014.2666,481.6762,1008.9053,489.938" style="stroke:#7F8C8D;stroke-width:1.0;"/><path d="M1016.2769,89.909 C1046.9154,107.4074 1068,132.9198 1068,170 C1068,170 1068,170 1068,405.5 C1068,442.0541 1043.936,467.1395 1013.9341,486.6652 " fill="none" style="stroke:#7F8C8D;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="91.5293" x="1087.1768" y="282.6387">gen_corpus.py:</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="125.8828" x="1070" y="296.6074">la etiqueta es el JOIN</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="86.707" x="1089.5879" y="310.5762">de los handles</text><!--SRC=[PLKzRnj74EtvAoPMSoHFJ9n60WK7a6KHK11RWXK524p3MEwDoBNkTfdTFIOIKhj8vpHfeoHDYbGgqeV_HByaR_QEF1aI86blRpxUl3SpzvcnkgmBfdSSeYdToDHLsGjNnYwLLnLvrb7PUSdFbRwQUrVRuiYLpjFE9FqyD5NsAl2IljplzRPkz6GmkF_uExrolb9qD1m-tIFjAaU5YYuC1fHnqDv4HRLL55ofQCKt_Qcrul1vfQ8tDwFtmTanQLKe09h3HZjBeIPThc_hK9TgQZDSHRPSE9-JMx9NsgplR4xBsaRNf_Lly8yyTtxzZv8dpsLZae9nsHXExVs7N-dCSs2_KlGpdTYLAaqXnnUyP5jmfjKIdeKgo27AGeL5_mcfqDQuStmu-MAozuY3MpgT2K0lHSzuRcpMp-dIs4B-3qpCIRynRt7bKOdS6GiGE8qkZGyHd2oKBH3k6NrIR5VMc4n4uRW5Mi-NxDbg8z2bDlOERBXWMc9INNo3SD-jRt5qJHL0-GZx7_IoZagGWwVA1EZN8HWJCkde42Y9bbMmRNDqsFAEyEm1Y4OTrBQbNFXl0UK4gRV659YgcbTCzD-_r0aZ3dXeN6W84EWcjkBhWMHgMzsIeMYj_VhlmW0mxfgid0LpmraVtbVzyIPzaoUOpcCCZSMbvXBkMTk5Njq0NiCUU7h4tfzq4H9vML9vE9I_46wmHDsRN0BEIeEdf0_Jo1krCi4bAcQ8cc5EaW9qvagZhr-wWf-TkI1lhn6pOwFpXJNQg49p9CUM779DJoP3qQqvrS2Roha8xb4vVz4ncAyRBGU3CSsKrObChO8BnD7yK7D4fe3BW7iaawPHJNzGTl4yf_F3oN5EPwVVd1nzt