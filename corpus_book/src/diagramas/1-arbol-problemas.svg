<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="286px" preserveAspectRatio="none" style="width:1345px;height:286px;background:#FFFFFF;" version="1.1" viewBox="0 0 1345 286" width="1345px" zoomAndPan="magnify"><defs/><g><!--entity E1--><g id="elem_E1"><rect fill="#F2F6FA" height="50.2656" rx="3" ry="3" style="stroke:#34495E;stroke-width:0.5;" width="352.5029" x="168" y="12"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="296.5371" x="195.9829" y="34.0669">Defectos de invalidaci&#243;n llegan a producci&#243;n:</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="332.5029" x="178" y="49.1997">fallas intermitentes y vulnerabilidades de memoria</text></g><!--entity E2--><g id="elem_E2"><rect fill="#F2F6FA" height="50.2656" rx="3" ry="3" style="stroke:#34495E;stroke-width:0.5;" width="297.3228" x="539" y="12"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="277.3228" x="549" y="34.0669">Revisores de pull requests dedican tiempo</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="207.5303" x="583.8962" y="49.1997">a buscar a mano estos defectos</text></g><!--entity E3--><g id="elem_E3"><rect fill="#F2F6FA" height="50.2656" rx="3" ry="3" style="stroke:#34495E;stroke-width:0.5;" width="278.0513" x="854.5" y="12"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="229.2583" x="878.8965" y="34.0669">Desconfianza en avisos del an&#225;lisis</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="258.0513" x="864.5" y="49.1997">(falsas alarmas, omisiones no medidas)</text></g><!--entity P--><g id="elem_P"><rect fill="#FFF4E0" height="80.5313" rx="3" ry="3" style="stroke:#34495E;stroke-width:0.5;" width="446.2705" x="464.5" y="98"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="125.9248" x="624.6729" y="120.0669">Problema central</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="426.2705" x="474.5" y="135.1997">Los equipos que desarrollan en C++ integran c&#243;digo con usos de</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="424.1948" x="475.5378" y="150.3325">iteradores, referencias y punteros invalidados porque su revisi&#243;n</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="417.3647" x="478.9529" y="165.4653">de pull requests no los detecta de forma autom&#225;tica y confiable</text></g><!--entity C1--><g id="elem_C1"><rect fill="#F2F6FA" height="65.3984" rx="3" ry="3" style="stroke:#34495E;stroke-width:0.5;" width="328.5786" x="6" y="215"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="308.5786" x="16" y="237.0669">CSA de referencia detecta pocos usos inv&#225;lidos</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="247.4316" x="46.5735" y="252.1997">(48 de 328 sobre el handle sostenido)</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="256.2993" x="42.1396" y="267.3325">y ninguno sobre referencias o punteros</text></g><!--entity C2--><g id="elem_C2"><rect fill="#F2F6FA" height="50.2656" rx="3" ry="3" style="stroke:#34495E;stroke-width:0.5;" width="324.4272" x="353.5" y="222.5"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="304.4272" x="363.5" y="244.5669">La regla depende del contenedor, la operaci&#243;n</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="258.502" x="386.4626" y="259.6997">y la capacidad: dif&#237;cil de aplicar a mano</text></g><!--entity C3--><g id="elem_C3"><rect fill="#F2F6FA" height="65.3984" rx="3" ry="3" style="stroke:#34495E;stroke-width:0.5;" width="330.3306" x="695.5" y="215"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="278.1606" x="721.585" y="237.0669">El an&#225;lisis est&#225;tico no forma parte del flujo</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="310.3306" x="705.5" y="252.1997">del pull request: nadie lo corre antes del merge</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="185.4214" x="767.9546" y="267.3325">ni comenta la l&#237;nea afectada</text></g><!--entity C4--><g id="elem_C4"><rect fill="#F2F6FA" height="50.2656" rx="3" ry="3" style="stroke:#34495E;stroke-width:0.5;" width="296.4341" x="1043.5" y="222.5"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="276.4341" x="1053.5" y="244.5669">Falta un banco etiquetado desde la norma</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="195.0952" x="1094.1694" y="259.6997">para medir cualquier detector</text></g><polygon fill="#34495E" points="427.5307,62.0862,435.06,68.4352,432.3328,63.4792,437.2888,60.752,427.5307,62.0862" style="stroke:#34495E;stroke-width:1.0;"/><path d="M433.2932,63.7578 C470.3688,74.513 509.2783,85.8001 551.0519,97.9181 " fill="none" style="stroke:#34495E;stroke-width:1.0;"/><polygon fill="#34495E" points="687.5,62.0862,683.5,71.0862,687.5,67.0862,691.5,71.0862,687.5,62.0862" style="stroke:#34495E;stroke-width:1.0;"/><path d="M687.5,68.0862 C687.5,78.7838 687.5,85.6616 687.5,97.7236 " fill="none" style="stroke:#34495E;stroke-width:1.0;"/><polygon fill="#34495E" points="919.4259,62.0862,909.6301,61.0653,914.671,63.6323,912.1039,68.6732,919.4259,62.0862" style="stroke:#34495E;stroke-width:1.0;"/><path d="M913.72,63.9415 C880.6438,74.6967 846.4966,85.8001 809.2292,97.9181 " fill="none" style="stroke:#34495E;stroke-width:1.0;"/><polygon fill="#34495E" points="496.4572,179.0388,486.8333,176.9459,491.5609,180.0522,488.4546,184.7799,496.4572,179.0388" style="stroke:#34495E;stroke-width:1.0;"/><path d="M490.5817,180.2549 C433.3404,192.1017 377.2298,203.7145 322.8344,214.9724 " fill="none" style="stroke:#34495E;stroke-width:1.0;"/><polygon fill="#34495E" points="623.9422,179.0388,614.1874,180.3964,619.6967,181.68,618.4132,187.1893,623.9422,179.0388" style="stroke:#34495E;stroke-width:1.0;"/><path d="M618.8476,182.2082 C595.4021,196.7935 574.6585,209.6979 554.0859,222.496 " fill="none" style="stroke:#34495E;stroke-width:1.0;"/><polygon fill="#34495E" points="751.4273,179.0388,756.9775,187.1749,755.6797,181.6689,761.1856,180.3711,751.4273,179.0388" style="stroke:#34495E;stroke-width:1.0;"/><path d="M756.5301,182.1949 C775.6844,194.0418 791.3235,203.7145 809.5254,214.9724 " fill="none" style="stroke:#34495E;stroke-width:1.0;"/><polygon fill="#34495E" points="873.7391,179.0388,881.7121,184.8207,878.63,180.0772,883.3735,176.9951,873.7391,179.0388" style="stroke:#34495E;stroke-width:1.0;"/><path d="M879.6082,180.2849 C948.3091,194.8702 1018.1519,209.6979 1078.4343,222.496 " fill="none" style="stroke:#34495E;stroke-width:1.0;"/><!--SRC=[PLJBSjD04BpxAvPm8KvC4Tj5fL9SWh5FERY06wAeyMgbB5dDY5rjYl0t-G1E-GJ_63sIuzZ5nTf7xqntpunVUROXbyxySAdpGTxwt8HHklFSKgJ6H6SxuZguZsJlwYYPouK4YURrQhfwlxe-W9QkeXowh-vtTnrypOtZpbZyk3Zgf3MTc8rqdG3fDQmN7etsySt99rTX8mc1ZETx2huawxTFR49mDR4XqqOfi-qFhmgkA0HAm293uplDbCo3kS-1NQIDrm2bw-Crhf7ewSG0lxmupFhPtViaSO2rEGH8_fLXXXwKtY9lvrtJIi5aDZbPYY3I48i1g6Sxq1vYJuyL9IjSUU8_P1m4Q2fz4GpnzZ7uv5F1Rw0ZuIq5YWsbSoCDBeH12KaQa2WfdGxXPqUEZSVhA9lW6kfzZXJ6uu9la08IV8ilb21TeXW5Nh6IM9oTzPRL4NkxVIfzBGOqJHwu5Gmh8vNgoJdCg5nqR3sfjMrMhoNjwrDYtKhKD2a3385Qd8B_CnDIGX-_K_vgTYMGQoYZ8xQF7Pn6Wi4kIEhbhj5bgzLy-Uv8zUBBjJv_OROFsef5Ybu72Ah1u0U3vvVwO3QzD4asqHduVqjS8XYWw1l0JWj-CEovpY0we0wborvwJsnnr