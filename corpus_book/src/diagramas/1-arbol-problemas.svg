<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="301px" preserveAspectRatio="none" style="width:1368px;height:301px;background:#FFFFFF;" version="1.1" viewBox="0 0 1368 301" width="1368px" zoomAndPan="magnify"><defs/><g><!--entity E1--><g id="elem_E1"><rect fill="#F2F6FA" height="50.2656" rx="3" ry="3" style="stroke:#34495E;stroke-width:0.5;" width="306.2666" x="211" y="19.5"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="286.2666" x="221" y="41.5669">Errores que llegan a producci&#243;n como fallas</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="262.0059" x="233.1304" y="56.6997">intermitentes o problemas de seguridad</text></g><!--entity E2--><g id="elem_E2"><rect fill="#F2F6FA" height="50.2656" rx="3" ry="3" style="stroke:#34495E;stroke-width:0.5;" width="252.9209" x="535.5" y="19.5"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="232.9209" x="545.5" y="41.5669">M&#225;s tiempo de revisi&#243;n para buscar</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="193.0449" x="565.438" y="56.6997">estos errores en cada cambio</text></g><!--entity E3--><g id="elem_E3"><rect fill="#F2F6FA" height="65.3984" rx="3" ry="3" style="stroke:#34495E;stroke-width:0.5;" width="340.7852" x="806.5" y="12"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="320.7852" x="816.5" y="34.0669">Poca confianza en las herramientas autom&#225;ticas:</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="238.583" x="857.6011" y="49.1997">no se sabe cu&#225;ntos errores detectan</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="194.2256" x="879.7798" y="64.3325">ni cu&#225;ntas falsas alarmas dan</text></g><!--entity P--><g id="elem_P"><rect fill="#FFF4E0" height="80.5313" rx="3" ry="3" style="stroke:#34495E;stroke-width:0.5;" width="445.2104" x="439.5" y="113"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="125.9248" x="599.1428" y="135.0669">Problema central</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="425.2104" x="449.5" y="150.1997">Los equipos que desarrollan en C++ incorporan a sus programas</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="397.0649" x="463.5728" y="165.3325">usos de marcadores inv&#225;lidos porque su revisi&#243;n de cambios</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="355.5195" x="484.3455" y="180.4653">no incluye una verificaci&#243;n autom&#225;tica de estas reglas</text></g><!--entity C1--><g id="elem_C1"><rect fill="#F2F6FA" height="65.3984" rx="3" ry="3" style="stroke:#34495E;stroke-width:0.5;" width="264.4419" x="6" y="230"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="244.4419" x="16" y="252.0669">La herramienta disponible revisa solo</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="150.9663" x="62.7378" y="267.1997">una parte de los casos,</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="195.6284" x="40.4067" y="282.3325">con funciones experimentales</text></g><!--entity C2--><g id="elem_C2"><rect fill="#F2F6FA" height="65.3984" rx="3" ry="3" style="stroke:#34495E;stroke-width:0.5;" width="370.5938" x="288.5" y="230"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="350.5938" x="298.5" y="252.0669">Las reglas cambian seg&#250;n la colecci&#243;n y la operaci&#243;n,</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="240.354" x="353.6199" y="267.1997">y el error involucra partes del c&#243;digo</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="282.8008" x="332.3965" y="282.3325">que pueden no estar en el cambio revisado</text></g><!--entity C3--><g id="elem_C3"><rect fill="#F2F6FA" height="65.3984" rx="3" ry="3" style="stroke:#34495E;stroke-width:0.5;" width="344.0605" x="678" y="230"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="324.0605" x="688" y="252.0669">Las herramientas autom&#225;ticas se ejecutan aparte</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="191.1216" x="754.4695" y="267.1997">y sus resultados no aparecen</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="163.0269" x="768.5168" y="282.3325">en la revisi&#243;n del cambio</text></g><!--entity C4--><g id="elem_C4"><rect fill="#F2F6FA" height="65.3984" rx="3" ry="3" style="stroke:#34495E;stroke-width:0.5;" width="322.2246" x="1040" y="230"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="292.2397" x="1054.9924" y="252.0669">No se encontr&#243; un conjunto p&#250;blico de casos</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="302.2246" x="1050" y="267.1997">de prueba para medir cu&#225;ntos errores detecta</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="269.5405" x="1066.342" y="282.3325">una herramienta y cu&#225;ntos se le escapan</text></g><polygon fill="#34495E" points="430.877,69.5129,437.9958,76.319,435.5829,71.2026,440.6993,68.7896,430.877,69.5129" style="stroke:#34495E;stroke-width:1.0;"/><path d="M436.524,71.5405 C472.1315,84.3257 511.1916,98.3507 551.7742,112.9223 " fill="none" style="stroke:#34495E;stroke-width:1.0;"/><polygon fill="#34495E" points="662,69.5129,658,78.5129,662,74.5129,666,78.5129,662,69.5129" style="stroke:#34495E;stroke-width:1.0;"/><path d="M662,75.5129 C662,88.2057 662,98.1187 662,112.606 " fill="none" style="stroke:#34495E;stroke-width:1.0;"/><polygon fill="#34495E" points="884.1933,77.0248,874.385,76.132,879.459,78.633,876.9581,83.707,884.1933,77.0248" style="stroke:#34495E;stroke-width:1.0;"/><path d="M878.5122,78.9546 C845.3922,90.2049 813.334,101.0945 778.4763,112.935 " fill="none" style="stroke:#34495E;stroke-width:1.0;"/><polygon fill="#34495E" points="456.579,194.0056,446.9757,191.8205,451.6733,194.972,448.5218,199.6696,456.579,194.0056" style="stroke:#34495E;stroke-width:1.0;"/><path d="M450.6922,195.1652 C393.1701,206.4962 336.5351,217.9043 279,230 C276.0545,230.6192 273.0753,231.2496 270.072,231.8888 " fill="none" style="stroke:#34495E;stroke-width:1.0;"/><polygon fill="#34495E" points="592.5299,194.0388,582.7294,195.0143,588.1844,196.5121,586.6866,201.967,592.5299,194.0388" style="stroke:#34495E;stroke-width:1.0;"/><path d="M587.3153,197.0067 C566.5003,208.8536 549.1745,218.7145 529.3943,229.9724 " fill="none" style="stroke:#34495E;stroke-width:1.0;"/><polygon fill="#34495E" points="731.4701,194.0388,737.3134,201.967,735.8156,196.5121,741.2706,195.0143,731.4701,194.0388" style="stroke:#34495E;stroke-width:1.0;"/><path d="M736.6847,197.0067 C757.4997,208.8536 774.8255,218.7145 794.6057,229.9724 " fill="none" style="stroke:#34495E;stroke-width:1.0;"/><polygon fill="#34495E" points="861.1723,194.0388,869.2212,199.7147,866.0766,195.0124,870.7789,191.8679,861.1723,194.0388" style="stroke:#34495E;stroke-width:1.0;"/><path d="M867.0575,195.2071 C926.7345,207.054 985.4732,218.7145 1042.1833,229.9724 " fill="none" style="stroke:#34495E;stroke-width:1.0;"/><!--SRC=[TLIzRjim4Dxz5DTqS-gYiOCEHPVKiAUqyD2jBWgQEYjCA5BXJn3tRVmCsRBgnVgTgBHoWImo9HxllZ_wZN7Qvehf5yTah7zlScCdySwuLWNLK62TbAijVr7